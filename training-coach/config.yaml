name: "Training Coach"
description: "AI coaching agent connected to your Intervals.icu training data."
version: "1.1.30"
slug: "training_coach"
init: false
arch:
  - aarch64
  - amd64
  - armv7

ingress: true
ingress_port: 8000
ingress_stream: false

panel_icon: "mdi:bike-fast"
panel_title: "Training Coach"

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Training Coach Web UI (direct access)"

options:
  openai_api_key: ""
  intervals_athlete_id: ""
  intervals_api_key: ""
  days_back: 28
  days_ahead: 21
  hrv_min: 48
  hrv_max: 69
  rhr_min: 45
  rhr_max: 54
  hard_intervals_per_week: 3
  block_start_date: ""
  group_ride_days: "Wednesday,Sunday"
  group_ride_weekday_tss: 120
  group_ride_weekend_tss: 180
  group_ride_keywords: "group,club"
  group_ride_counts_as_intervals: "Wednesday"
  chat_model: "gpt-5.4"
  auto_review_model: "gpt-5.4-mini"

schema:
  openai_api_key: str
  intervals_athlete_id: str
  intervals_api_key: str
  days_back: int
  days_ahead: int
  hrv_min: int
  hrv_max: int
  rhr_min: int
  rhr_max: int
  hard_intervals_per_week: int
  block_start_date: str
  group_ride_days: str
  group_ride_weekday_tss: int
  group_ride_weekend_tss: int
  group_ride_keywords: str
  group_ride_counts_as_intervals: str
  chat_model: str
  auto_review_model: str

startup: application
boot: auto
