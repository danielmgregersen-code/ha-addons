name: "Training Coach"
description: "AI coaching agent connected to your Intervals.icu training data."
version: "1.5.0"
slug: "training_coach"
init: false
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8000
ingress_stream: false

panel_icon: "mdi:bike-fast"
panel_title: "Training Coach"

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Training Coach Web UI (direct access)"

options:
  openai_api_key: ""
  intervals_athlete_id: ""
  intervals_api_key: ""
  days_back: 28
  days_ahead: 21
  max_hours: 8
  max_tss: 500
  hrv_min: 48
  hrv_max: 69
  rhr_min: 45
  rhr_max: 54
  hard_intervals_per_week: 3
  block_start_date: ""
  group_ride_keywords: "group,klub,klubtur"
  group_ride_intensity: "moderate"
  group_ride_if_easy_short: 0.65
  group_ride_if_easy_long: 0.60
  group_ride_if_moderate_short: 0.72
  group_ride_if_moderate_long: 0.70
  group_ride_if_hard_short: 0.80
  group_ride_if_hard_long: 0.77
  group_ride_long_ride_hours: 3
  chat_model: "gpt-5.5"
  auto_review_model: "gpt-5.5"
  reasoning_effort: "medium"
  ha_notification_target: ""
  training_readiness_entity: "sensor.garmin_connect_training_readiness"
  nightly_hrv_entity: "sensor.garmin_connect_hrv_last_night_average"
  daily_token_budget: 250000

schema:
  openai_api_key: str
  intervals_athlete_id: str
  intervals_api_key: str
  days_back: int
  days_ahead: int
  max_hours: int
  max_tss: int
  hrv_min: int
  hrv_max: int
  rhr_min: int
  rhr_max: int
  hard_intervals_per_week: int
  block_start_date: str
  group_ride_keywords: str
  group_ride_intensity: list(easy|moderate|hard)
  group_ride_if_easy_short: float(0.3,1.2)
  group_ride_if_easy_long: float(0.3,1.2)
  group_ride_if_moderate_short: float(0.3,1.2)
  group_ride_if_moderate_long: float(0.3,1.2)
  group_ride_if_hard_short: float(0.3,1.2)
  group_ride_if_hard_long: float(0.3,1.2)
  group_ride_long_ride_hours: float(1,12)
  chat_model: str
  auto_review_model: str
  reasoning_effort: list(none|low|medium|high)
  ha_notification_target: str
  training_readiness_entity: str
  nightly_hrv_entity: str
  daily_token_budget: int

homeassistant_api: true

startup: application
boot: auto
