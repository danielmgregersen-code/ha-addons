name: "Training Coach"
description: "AI coaching agent connected to your Intervals.icu training data. Chat with your coach from Home Assistant."
version: "1.0.0"
slug: "training_coach"
init: false
arch:
  - aarch64
  - amd64
  - armv7

homeassistant_api: false
hassio_api: false

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Training Coach Web UI"

options:
  openai_api_key: ""
  intervals_athlete_id: ""
  intervals_api_key: ""
  days_back: 14
  days_ahead: 21

schema:
  openai_api_key: str
  intervals_athlete_id: str
  intervals_api_key: str
  days_back: int
  days_ahead: int

panel_icon: "mdi:bike-fast"
panel_title: "Training Coach"

startup: application
boot: auto

map:
  - config:rw
