name: "Training Coach"
description: "AI coaching agent connected to your Intervals.icu training data."
version: "1.0.5"
slug: "training_coach"
init: false
arch:
  - aarch64
  - amd64
  - armv7

# Ingress makes the UI appear natively inside HA — no iFrame needed
ingress: true
ingress_port: 8000
ingress_stream: false

panel_icon: "mdi:bike-fast"
panel_title: "Training Coach"

# Keep direct port access as fallback
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Training Coach Web UI (direct access)"

options:
  openai_api_key: ""
  intervals_athlete_id: ""
  intervals_api_key: ""
  days_back: 14
  days_ahead: 21

schema:
  openai_api_key: str
  intervals_athlete_id: str
  intervals_api_key: str
  days_back: int
  days_ahead: int

startup: application
boot: auto
