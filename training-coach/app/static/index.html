<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Coach</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #14171f;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #e8f04a;
    --accent2: #4af0a0;
    --text: #e8eaf0;
    --muted: #5a6080;
    --user-bubble: #1e2540;
    --coach-bubble: #13161e;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 20px; height: 20px; }

  .header-text h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 15px;
    color: var(--text); letter-spacing: 0.02em;
  }

  .header-text p { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    flex-shrink: 0;
  }

  #clear-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s;
  }
  #clear-btn:hover { border-color: var(--muted); color: var(--text); }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex; flex-direction: column;
    max-width: 88%;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.coach { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 5px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .message.user .msg-label { color: var(--accent); }

  .bubble {
    padding: 12px 16px; border-radius: var(--radius);
    font-size: 13.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #2a3256;
    border-bottom-right-radius: 3px;
  }

  .message.coach .bubble {
    background: var(--coach-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .thinking {
    align-self: flex-start;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--coach-bubble);
    border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 3px;
    font-size: 12px; color: var(--muted);
    animation: fadeUp 0.2s ease;
  }

  .dots { display: flex; gap: 4px; }
  .dots span {
    width: 5px; height: 5px;
    background: var(--muted); border-radius: 50%;
    animation: dot 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .welcome {
    align-self: center; text-align: center;
    padding: 40px 20px; max-width: 340px;
  }

  .welcome-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .welcome-icon svg { width: 28px; height: 28px; }

  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 18px; margin-bottom: 8px; color: var(--text);
  }

  .welcome p { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

  .suggestions { display: flex; flex-direction: column; gap: 8px; }

  .suggestion {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: var(--text);
    cursor: pointer; text-align: left;
    font-family: 'DM Mono', monospace;
    transition: all 0.15s; line-height: 1.4;
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); background: rgba(232, 240, 74, 0.05); }

  .input-area {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
  }

  #input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 14px;
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 13px; resize: none; outline: none;
    min-height: 44px; max-height: 120px; line-height: 1.5;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }

  #send-btn {
    width: 44px; height: 44px; background: var(--accent);
    border: none; border-radius: var(--radius); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  #send-btn:hover { background: #f0f85a; transform: scale(1.05); }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #send-btn svg { width: 18px; height: 18px; color: #0d0f14; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Training Coach</h1>
      <p>Intervals.icu · GPT-5.4-mini</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="status-dot"></div>
    <button id="clear-btn">New chat</button>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h2>Ready to train smarter</h2>
    <p>Ask me about your recent workouts, interval analysis, upcoming plan, or request changes to your calendar.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="sendSuggestion(this)">How did my training look this past week?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Analyse my intervals from yesterday</button>
      <button class="suggestion" onclick="sendSuggestion(this)">What does my upcoming plan look like?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">I'm feeling fatigued — ease up next week</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask your coach…" rows="1"></textarea>
  <button id="send-btn" onclick="send()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
  // Ingress base path injected by server — empty string when accessed directly
  const BASE = '__INGRESS_PATH__';

  const sessionId = Math.random().toString(36).slice(2);
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  let busy = false;

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  document.getElementById('clear-btn').addEventListener('click', async () => {
    await fetch(`${BASE}/chat/${sessionId}`, { method: 'DELETE' });
    location.reload();
  });

  function sendSuggestion(btn) {
    inputEl.value = btn.textContent;
    send();
  }

  function addMessage(role, text) {
    document.getElementById('welcome')?.remove();
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    wrap.innerHTML = `
      <div class="msg-label">${role === 'user' ? 'YOU' : 'COACH'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showThinking() {
    const el = document.createElement('div');
    el.className = 'thinking'; el.id = 'thinking';
    el.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span>Checking your data…</span>`;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideThinking() { document.getElementById('thinking')?.remove(); }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function send() {
    if (busy) return;
    const text = inputEl.value.trim();
    if (!text) return;
    busy = true; sendBtn.disabled = true;
    inputEl.value = ''; inputEl.style.height = 'auto';
    addMessage('user', text);
    showThinking();
    try {
      const res = await fetch(`${BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Server error'); }
      const data = await res.json();
      hideThinking();
      addMessage('coach', data.reply);
    } catch (e) {
      hideThinking();
      addMessage('coach', `⚠ Error: ${e.message}`);
    } finally {
      busy = false; sendBtn.disabled = false; inputEl.focus();
    }
  }
</script>
</body>
</html>
