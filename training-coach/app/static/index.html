<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Coach</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #0d0f14; --surface: #14171f; --surface2: #1c2030;
    --border: #252a3a; --accent: #e8f04a; --accent2: #4af0a0;
    --text: #e8eaf0; --muted: #5a6080;
    --user-bubble: #1e2540; --coach-bubble: #13161e;
    --radius: 12px; --sidebar-w: 190px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; z-index: 10; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 20px; height: 20px; }
  .header-text h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; color: var(--text); letter-spacing: 0.02em; }
  .header-text p { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); flex-shrink: 0; }
  .header-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  .header-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Tab bar ── */
  .tab-bar { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; padding: 0 16px; flex-shrink: 0; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 16px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-badge { background: var(--accent); color: #0d0f14; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; line-height: 1.4; }

  .main { display: flex; flex: 1; overflow: hidden; }

  #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .sidebar-header { padding: 12px 12px 8px; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  #new-session-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px; transition: opacity 0.15s; }
  #new-session-btn:hover { opacity: 0.7; }
  #session-list { flex: 1; overflow-y: auto; padding: 6px; }
  #session-list::-webkit-scrollbar { width: 3px; }
  #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .session-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; gap: 6px; transition: background 0.12s; border: 1px solid transparent; margin-bottom: 2px; }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--surface2); border-color: var(--accent); }
  .session-name { flex: 1; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item.active .session-name { color: var(--accent); }
  .session-delete { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: #f06060; }
  .sidebar-hint { padding: 10px 12px; font-size: 10px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); }
  /* ── Notifications ── */
  #notif-banner {
    position: fixed; bottom: 80px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 50; max-width: 340px;
  }
  .notif-card {
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 12px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .notif-header { font-size: 10px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .notif-title { font-size: 12px; color: var(--text); font-weight: 500; margin-bottom: 4px; }
  .notif-preview { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .notif-btns { display: flex; gap: 6px; }
  .notif-btn { font-family: 'DM Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--muted); transition: all 0.15s; }
  .notif-btn.primary { background: var(--accent); border-color: var(--accent); color: #0d0f14; }
  .notif-btn:hover { border-color: var(--text); color: var(--text); }
  .notif-btn.primary:hover { opacity: 0.85; }
  .notif-dismiss { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
  .notif-dismiss:hover { color: var(--text); }

  /* ── Mobile sidebar toggle ── */
  #sidebar-toggle {
    display: none;
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  #sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 600px) {
    #sidebar-toggle { display: block; }
    #sidebar {
      position: absolute; left: 0; top: 0; bottom: 0;
      z-index: 20; transform: translateX(-100%);
      transition: transform 0.2s ease;
      width: 220px;
    }
    #sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.4); }
    .main { position: relative; }
  }

  .session-badge {
    background: var(--accent); color: #0d0f14;
    font-size: 9px; font-weight: 700; padding: 1px 5px;
    border-radius: 8px; flex-shrink: 0; line-height: 1.4;
  }
  .session-item.auto-reviews .session-name { color: var(--accent2); }
  .session-item.auto-reviews.active .session-name { color: var(--accent2); }

  .session-name-input {
    flex: 1; background: var(--surface); border: 1px solid var(--accent);
    border-radius: 4px; padding: 2px 5px; color: var(--accent);
    font-family: 'DM Mono', monospace; font-size: 12px; outline: none; min-width: 0;
  }

  .dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .dialog-overlay.open { display: flex; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .dialog h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
  .dialog input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .dialog input:focus { border-color: var(--accent); }
  .dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .btn-create { background: var(--accent); border: none; color: #0d0f14; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message { display: flex; flex-direction: column; max-width: 88%; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.coach { align-self: flex-start; align-items: flex-start; }
  .msg-label { font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .message.user .msg-label { color: var(--accent); }
  .bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.65; word-break: break-word; }
  .message.user .bubble { background: var(--user-bubble); border: 1px solid #2a3256; border-bottom-right-radius: 3px; }
  .message.coach .bubble { background: var(--coach-bubble); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .message.coach .bubble p { margin: 0 0 8px; }
  .message.coach .bubble p:last-child { margin-bottom: 0; }
  .message.coach .bubble ul, .message.coach .bubble ol { margin: 4px 0 8px 18px; }
  .message.coach .bubble li { margin-bottom: 3px; }
  .message.coach .bubble strong { color: var(--accent); font-weight: 600; }
  .message.coach .bubble em { color: var(--accent2); }
  .message.coach .bubble h1, .message.coach .bubble h2, .message.coach .bubble h3 { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--text); margin: 10px 0 6px; font-size: 14px; letter-spacing: 0.02em; }
  .message.coach .bubble code { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .message.coach .bubble pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .message.coach .bubble pre code { background: none; border: none; padding: 0; }
  .message.coach .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .history-divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin: 4px 0; }
  .history-divider::before, .history-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .thinking { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--coach-bubble); border: 1px solid var(--border); border-radius: var(--radius); border-bottom-left-radius: 3px; font-size: 12px; color: var(--muted); animation: fadeUp 0.2s ease; }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 5px; height: 5px; background: var(--muted); border-radius: 50%; animation: dot 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  .welcome { align-self: center; text-align: center; padding: 40px 20px; max-width: 340px; }
  .welcome-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .welcome-icon svg { width: 28px; height: 28px; }
  .welcome h2 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 8px; color: var(--text); }
  .welcome p { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; }
  .suggestion { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--text); cursor: pointer; text-align: left; font-family: 'DM Mono', monospace; transition: all 0.15s; line-height: 1.4; }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); background: rgba(232, 240, 74, 0.05); }
  .input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; resize: none; outline: none; min-height: 44px; max-height: 120px; line-height: 1.5; transition: border-color 0.15s; }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #send-btn { width: 44px; height: 44px; background: var(--accent); border: none; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  #send-btn:hover { background: #f0f85a; transform: scale(1.05); }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #send-btn svg { width: 18px; height: 18px; color: #0d0f14; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Training Coach</h1>
      <p>Intervals.icu · GPT-5.5</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="status-dot"></div>
    <button id="sidebar-toggle" onclick="toggleSidebar()">☰ Chats</button>
    <button class="header-btn" id="clear-btn">Clear chat</button>
  </div>
</header>

<div class="tab-bar" id="tab-bar"></div>

<div class="main">
  <div id="sidebar">
    <div class="sidebar-header">
      <span>Sessions</span>
      <button id="new-session-btn" title="New session">+</button>
    </div>
    <div id="session-list"></div>
    <div class="sidebar-hint">Session names must match across devices to share history.</div>
    <div class="sidebar-hint" id="token-counter" style="border-top:none;padding-top:2px;">Tokens today: —</div>
  </div>
  <div class="chat-area">
    <div id="messages"></div>
    <div class="input-area">
      <textarea id="input" placeholder="Ask your coach…" rows="1"></textarea>
      <button id="send-btn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="notif-banner"></div>

<div class="dialog-overlay" id="dialog-overlay">
  <div class="dialog">
    <h3>New session</h3>
    <input type="text" id="session-name-input" placeholder="e.g. Last week, Block 3, Recovery…" maxlength="40">
    <div class="dialog-btns">
      <button class="btn-cancel" id="dialog-cancel">Cancel</button>
      <button class="btn-create" id="dialog-create">Create</button>
    </div>
  </div>
</div>

<script>
  const BASE = '__INGRESS_PATH__';
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const sessionListEl = document.getElementById('session-list');
  const tabBarEl = document.getElementById('tab-bar');
  let currentSessionId = null;
  let busy = false;
  let activeMode = localStorage.getItem('activeMode') || 'review';

  const AUTO_REVIEW_SESSION = 'auto-reviews';
  const WEEKLY_RECAP_SESSION = 'auto-weekly-recap';
  const WELLNESS_SESSION = 'auto-wellness-check';
  const SPECIAL_SESSIONS = new Set([AUTO_REVIEW_SESSION, WEEKLY_RECAP_SESSION, WELLNESS_SESSION]);

  // ── Mode helpers ──

  function getModePrefix(mode) {
    return mode === 'planning' ? 'plan' : mode;
  }

  function isKnownModeId(id) {
    return id.startsWith('review-') || id.startsWith('health-') || id.startsWith('plan-') || SPECIAL_SESSIONS.has(id);
  }

  function getSessionsForMode(mode) {
    const prefix = getModePrefix(mode) + '-';
    return getSessions().filter(s => {
      if (mode === 'review') return s.id.startsWith(prefix) || s.id === AUTO_REVIEW_SESSION || s.id === WEEKLY_RECAP_SESSION || !isKnownModeId(s.id);
      if (mode === 'health') return s.id.startsWith(prefix) || s.id === WELLNESS_SESSION;
      return s.id.startsWith(prefix);
    });
  }

  function ensureSessionForMode(mode) {
    const existing = getSessionsForMode(mode);
    if (existing.length) return existing;
    const prefix = getModePrefix(mode);
    const id = prefix + '-default';
    const names = { review: 'General', health: 'Wellness', planning: 'Planning' };
    const all = getSessions();
    all.push({ id, name: names[mode] || 'General' });
    saveSessions(all);
    return [{ id, name: names[mode] || 'General' }];
  }

  // ── Tab bar ──

  const unreadByTab = { review: 0, health: 0 };

  function renderTabs() {
    const modes = [
      { id: 'review',   label: 'Review' },
      { id: 'health',   label: 'Health' },
      { id: 'planning', label: 'Planning' },
    ];
    tabBarEl.innerHTML = modes.map(m => {
      const count = unreadByTab[m.id] || 0;
      const badge = (count > 0 && activeMode !== m.id)
        ? `<span class="tab-badge">${count}</span>` : '';
      return `<button class="tab${activeMode === m.id ? ' active' : ''}" onclick="switchMode('${m.id}')">${m.label}${badge}</button>`;
    }).join('');
  }

  async function switchMode(mode) {
    if (mode === activeMode && currentSessionId) return;
    activeMode = mode;
    localStorage.setItem('activeMode', mode);
    // Reset tab badge when entering the tab
    if (unreadByTab[mode] !== undefined) unreadByTab[mode] = 0;
    renderTabs();

    const sessions = ensureSessionForMode(mode);
    const lastId = localStorage.getItem('lastSession_' + mode);
    const target = (lastId && sessions.find(s => s.id === lastId)) ? lastId : sessions[0].id;

    renderSidebar();
    messagesEl.innerHTML = '';
    currentSessionId = null;
    await switchSession(target);
  }

  // ── Session storage ──

  function getSessions() {
    try { return JSON.parse(localStorage.getItem('coach_sessions') || '[]'); } catch { return []; }
  }
  function saveSessions(s) { localStorage.setItem('coach_sessions', JSON.stringify(s)); }
  function slugify(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'session'; }

  function ensureDefaults() {
    let s = getSessions();
    if (!s.find(x => x.id === AUTO_REVIEW_SESSION)) {
      s.push({ id: AUTO_REVIEW_SESSION, name: '⚡ Auto-reviews' });
    }
    if (!s.find(x => x.id === WEEKLY_RECAP_SESSION)) {
      s.push({ id: WEEKLY_RECAP_SESSION, name: '📊 Weekly recaps' });
    }
    if (!s.find(x => x.id === WELLNESS_SESSION)) {
      s.push({ id: WELLNESS_SESSION, name: '❤️ Wellness checks' });
    }
    if (!s.find(x => !isKnownModeId(x.id) || x.id.startsWith('review-') || x.id === AUTO_REVIEW_SESSION || x.id === WEEKLY_RECAP_SESSION)) {
      s.unshift({ id: 'review-default', name: 'General' });
    }
    saveSessions(s);
    return s;
  }

  // ── Server sync ──

  async function syncSessionsFromServer() {
    try {
      const [sessRes, nameRes] = await Promise.all([
        fetch(`${BASE}/sessions`),
        fetch(`${BASE}/session-names`),
      ]);
      if (!sessRes.ok) return;
      const serverSessions = await sessRes.json();
      const serverNames = nameRes.ok ? await nameRes.json() : {};
      const local = getSessions();
      const localIds = new Set(local.map(s => s.id));
      let changed = false;

      for (const [id, meta] of Object.entries(serverSessions)) {
        if (!localIds.has(id) && !SPECIAL_SESSIONS.has(id)) {
          const name = serverNames[id] || meta.name || id;
          local.push({ id, name });
          changed = true;
        }
      }

      for (const s of local) {
        if (serverNames[s.id] && serverNames[s.id] !== s.name) {
          s.name = serverNames[s.id];
          changed = true;
        }
      }

      if (changed) {
        saveSessions(local);
        renderSidebar();
      }
    } catch {}
  }

  // ── Sidebar ──

  // Per-session unread counts (for sidebar badges on special sessions)
  const unreadBySession = {};

  function renderSidebar() {
    sessionListEl.innerHTML = '';
    getSessionsForMode(activeMode).forEach(s => {
      const isSpecial = SPECIAL_SESSIONS.has(s.id);
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '') + (s.id === AUTO_REVIEW_SESSION ? ' auto-reviews' : '');
      const sessionUnread = (unreadBySession[s.id] || 0);
      const badge = (sessionUnread > 0 && s.id !== currentSessionId)
        ? `<span class="session-badge">${sessionUnread}</span>` : '';
      const deleteBtn = isSpecial ? '' : `<button class="session-delete" title="Delete" data-id="${s.id}">×</button>`;
      el.innerHTML = `<span class="session-name" title="${isSpecial ? '' : 'Double-click to rename'}">${escapeHtml(s.name)}</span>${badge}${deleteBtn}`;
      el.addEventListener('click', e => {
        if (!e.target.classList.contains('session-delete') && !e.target.classList.contains('session-name-input')) {
          if (isSpecial) unreadBySession[s.id] = 0;
          switchSession(s.id);
        }
      });
      if (!isSpecial) {
        el.querySelector('.session-delete')?.addEventListener('click', () => deleteSession(s.id));
        el.querySelector('.session-name').addEventListener('dblclick', e => { e.stopPropagation(); startRename(s.id, el); });
      }
      sessionListEl.appendChild(el);
    });
  }

  function startRename(id, el) {
    const nameEl = el.querySelector('.session-name');
    const current = getSessions().find(s => s.id === id)?.name || '';
    const inp = document.createElement('input');
    inp.className = 'session-name-input';
    inp.value = current;
    inp.maxLength = 40;
    nameEl.replaceWith(inp);
    inp.focus();
    inp.select();
    const commit = () => {
      const val = inp.value.trim();
      if (val && val !== current) {
        const sessions = getSessions();
        const s = sessions.find(x => x.id === id);
        if (s) { s.name = val; saveSessions(sessions); saveSessionNameToServer(id, val); }
      }
      renderSidebar();
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { inp.value = current; inp.blur(); }
      e.stopPropagation();
    });
  }

  async function switchSession(id) {
    if (id === currentSessionId) return;
    currentSessionId = id;
    localStorage.setItem('lastSession_' + activeMode, id);
    renderSidebar();
    messagesEl.innerHTML = '';
    await loadHistory();
  }

  async function deleteSession(id) {
    const s = getSessions(), item = s.find(x => x.id === id);
    if (!confirm(`Delete "${item?.name}"? History will be cleared.`)) return;
    await fetch(`${BASE}/chat/${id}`, { method: 'DELETE' });
    const updated = s.filter(x => x.id !== id);
    saveSessions(updated);
    if (currentSessionId === id) {
      currentSessionId = null;
      const remaining = getSessionsForMode(activeMode);
      if (!remaining.length) {
        await switchMode(activeMode);
      } else {
        await switchSession(remaining[0].id);
      }
    } else {
      renderSidebar();
    }
  }

  document.getElementById('new-session-btn').addEventListener('click', () => {
    document.getElementById('session-name-input').value = '';
    document.getElementById('dialog-overlay').classList.add('open');
    setTimeout(() => document.getElementById('session-name-input').focus(), 50);
  });
  document.getElementById('dialog-cancel').addEventListener('click', () => document.getElementById('dialog-overlay').classList.remove('open'));
  document.getElementById('dialog-create').addEventListener('click', createSession);
  document.getElementById('session-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') createSession();
    if (e.key === 'Escape') document.getElementById('dialog-overlay').classList.remove('open');
  });

  function createSession() {
    const name = document.getElementById('session-name-input').value.trim();
    if (!name) return;
    const prefix = getModePrefix(activeMode);
    const id = prefix + '-' + slugify(name) + '-' + Date.now().toString(36);
    const s = getSessions();
    s.push({ id, name });
    saveSessions(s);
    saveSessionNameToServer(id, name);
    document.getElementById('dialog-overlay').classList.remove('open');
    switchSession(id);
  }

  async function saveSessionNameToServer(id, name) {
    try {
      await fetch(`${BASE}/session-names`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name }),
      });
    } catch {}
  }

  document.getElementById('clear-btn').addEventListener('click', async () => {
    const s = getSessions(), item = s.find(x => x.id === currentSessionId);
    if (!confirm(`Clear "${item?.name}" history on all devices?`)) return;
    await fetch(`${BASE}/chat/${currentSessionId}`, { method: 'DELETE' });
    messagesEl.innerHTML = '';
    showWelcome();
  });

  // ── Utilities ──

  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderContent(role, text) {
    if (role === 'coach') return marked.parse(text, { breaks: true });
    return `<span style="white-space:pre-wrap">${escapeHtml(text)}</span>`;
  }

  function addMessage(role, text, animate = true) {
    document.getElementById('welcome')?.remove();
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    if (!animate) wrap.style.animation = 'none';
    wrap.innerHTML = `<div class="msg-label">${role === 'user' ? 'YOU' : 'COACH'}</div><div class="bubble">${renderContent(role, text)}</div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  const WELCOME_CONFIG = {
    review: {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      heading: 'Review your rides',
      desc: 'Analyse recent workouts, check interval execution, compare against targets, and post coach notes.',
      suggestions: [
        'Analyse my last ride',
        'How did my intervals go yesterday?',
        'Review this week\'s training',
        'Post a comment on my latest ride',
      ],
    },
    health: {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      heading: 'Wellness overview',
      desc: 'Check your HRV trends, recovery status, and whether your body is ready for today\'s session.',
      suggestions: [
        'How is my HRV looking?',
        'Am I recovered enough for today?',
        'Is my training load sustainable?',
        'Should I adjust today\'s session?',
      ],
    },
    planning: {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      heading: 'Plan your training',
      desc: 'Build multi-week training blocks, schedule workouts, and prepare for upcoming races.',
      suggestions: [
        'Build me a 4-week training block',
        'Plan next week',
        'What phase am I in for my upcoming race?',
        'Adjust this week\'s plan',
      ],
    },
  };

  function showWelcome() {
    const cfg = WELCOME_CONFIG[activeMode] || WELCOME_CONFIG.review;
    const div = document.createElement('div');
    div.className = 'welcome'; div.id = 'welcome';
    div.innerHTML = `
      <div class="welcome-icon">${cfg.icon}</div>
      <h2>${cfg.heading}</h2>
      <p>${cfg.desc}</p>
      <div class="suggestions">
        ${cfg.suggestions.map(s => `<button class="suggestion" onclick="sendSuggestion(this)">${escapeHtml(s)}</button>`).join('')}
      </div>`;
    messagesEl.appendChild(div);
  }

  function showThinking() {
    const el = document.createElement('div');
    el.className = 'thinking'; el.id = 'thinking';
    el.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span>Checking your data…</span>`;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideThinking() { document.getElementById('thinking')?.remove(); }
  function sendSuggestion(btn) { document.getElementById('welcome')?.remove(); inputEl.value = btn.textContent; send(); }

  async function loadHistory() {
    if (!currentSessionId) return;
    try {
      const res = await fetch(`${BASE}/history/${currentSessionId}`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (data.messages?.length) {
        const d = document.createElement('div');
        d.className = 'history-divider'; d.textContent = 'Previous conversation';
        messagesEl.appendChild(d);
        for (const m of data.messages) addMessage(m.role === 'user' ? 'user' : 'coach', m.content, false);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else { showWelcome(); }
    } catch { showWelcome(); }
  }

  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'; });
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  // Poll /history for a recovered assistant reply after a network error.
  // Used when the ingress proxy kills a long-running /chat request before
  // the backend has time to respond — the reply is still persisted server-side.
  async function pollForReply(sessionId, baseline, maxSeconds = 180, intervalMs = 5000) {
    const deadline = Date.now() + maxSeconds * 1000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, intervalMs));
      try {
        const res = await fetch(`${BASE}/history/${sessionId}`);
        if (!res.ok) continue;
        const data = await res.json();
        const msgs = data.messages || [];
        const last = msgs[msgs.length - 1];
        if (msgs.length >= baseline + 2 && last?.role === 'assistant' && last.content) {
          return last.content;
        }
      } catch {}
    }
    return null;
  }

  async function send() {
    if (busy || !currentSessionId) return;
    const text = inputEl.value.trim();
    if (!text) return;
    busy = true; sendBtn.disabled = true;
    inputEl.value = ''; inputEl.style.height = 'auto';
    addMessage('user', text);
    showThinking();

    let historyBaseline = null;
    try {
      const histRes = await fetch(`${BASE}/history/${currentSessionId}`);
      if (histRes.ok) {
        const histData = await histRes.json();
        historyBaseline = (histData.messages || []).length;
      }
    } catch {}

    try {
      const res = await fetch(`${BASE}/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, message: text, mode: activeMode }),
      });
      if (!res.ok) {
        let detail = 'Server error';
        try { const t = await res.text(); try { detail = JSON.parse(t).detail || t || detail; } catch { detail = t || detail; } } catch {}
        throw new Error(detail);
      }
      const data = await res.json();
      hideThinking(); addMessage('coach', data.reply); refreshTokens();
    } catch(e) {
      // TypeError typically means the connection was killed (e.g. ingress
      // proxy timeout). The backend may have completed and persisted the
      // reply — poll /history to recover it.
      const isNetworkError = e instanceof TypeError;
      if (isNetworkError && historyBaseline !== null) {
        const reply = await pollForReply(currentSessionId, historyBaseline);
        if (reply) {
          hideThinking(); addMessage('coach', reply); refreshTokens();
          return;
        }
      }
      hideThinking(); addMessage('coach', `⚠ Error: ${e.message}`);
    }
    finally { busy = false; sendBtn.disabled = false; inputEl.focus(); messagesEl.scrollTop = messagesEl.scrollHeight; }
  }

  // ── Notifications ──

  const shownNotifIds = new Set();
  const notifBanner = document.getElementById('notif-banner');

  // Maps notification type → { tab, session, header, primaryLabel, targetMode }
  const NOTIF_CONFIG = {
    auto_review:       { tab: 'review', session: AUTO_REVIEW_SESSION,    header: '⚡ Auto-review',    primaryLabel: 'More detail', targetMode: 'review' },
    auto_review_error: { tab: 'review', session: AUTO_REVIEW_SESSION,    header: '⚠ Auto-review failed', primaryLabel: null,         targetMode: 'review' },
    weekly_recap:      { tab: 'review', session: WEEKLY_RECAP_SESSION,   header: '📊 Weekly recap',   primaryLabel: 'View recap',  targetMode: 'review' },
    wellness_alert:    { tab: 'health', session: WELLNESS_SESSION,       header: '⚠ Wellness alert',  primaryLabel: 'View in Health', targetMode: 'health' },
  };

  function showNotification(notif) {
    const cfg = NOTIF_CONFIG[notif.type];
    if (!cfg) return; // wellness_ok and unknown types are silent
    const preview = (notif.comment || '').length > 120 ? notif.comment.slice(0, 120) + '…' : (notif.comment || '');
    const card = document.createElement('div');
    card.className = 'notif-card';
    card.dataset.id = notif.id;
    card.dataset.activityId = notif.activity_id || '';
    card.dataset.activityName = notif.activity_name || '';
    card.dataset.targetMode = cfg.targetMode;
    card.dataset.targetSession = cfg.session;
    card.innerHTML = `
      <div class="notif-header">
        <span>${cfg.header} — ${escapeHtml(notif.activity_date)}</span>
        <button class="notif-dismiss">×</button>
      </div>
      <div class="notif-title">${escapeHtml(notif.activity_name || '')}</div>
      <div class="notif-preview">${escapeHtml(preview)}</div>
      <div class="notif-btns">
        ${cfg.primaryLabel ? `<button class="notif-btn primary">${cfg.primaryLabel}</button>` : ''}
        <button class="notif-btn">Dismiss</button>
      </div>
    `;
    card.querySelector('.notif-dismiss').addEventListener('click', () => dismissNotif(notif.id));
    if (cfg.primaryLabel) {
      card.querySelector('.notif-btn.primary').addEventListener('click', () => {
        const t = card.dataset;
        if (notif.type === 'auto_review') {
          askMoreDetail(t.activityId, t.activityName, notif.id);
        } else {
          dismissNotif(notif.id);
          const targetMode = t.targetMode;
          if (activeMode !== targetMode) {
            switchMode(targetMode);
          }
        }
      });
    }
    card.querySelector('.notif-btn:not(.primary)').addEventListener('click', () => dismissNotif(notif.id));
    notifBanner.appendChild(card);
    setTimeout(() => dismissNotif(notif.id), 60000);
  }

  function dismissNotif(id) {
    const card = notifBanner.querySelector(`[data-id="${id}"]`);
    if (card) card.remove();
    fetch(`${BASE}/notifications/${encodeURIComponent(id)}/seen`, { method: 'POST' }).catch(() => {});
  }

  function askMoreDetail(activityId, activityName, notifId) {
    dismissNotif(notifId);
    const msg = `Please give me a more detailed analysis of the ride "${activityName}" (ID: ${activityId})`;
    if (activeMode !== 'review') {
      switchMode('review').then(() => { inputEl.value = msg; send(); });
    } else {
      inputEl.value = msg;
      send();
    }
  }

  async function pollNotifications() {
    try {
      const res = await fetch(`${BASE}/notifications`);
      if (!res.ok) return;
      const data = await res.json();
      const unseen = (data.notifications || []).filter(n => !n.seen);
      const newOnes = unseen.filter(n => !shownNotifIds.has(n.id));
      newOnes.forEach(n => {
        shownNotifIds.add(n.id);
        const cfg = NOTIF_CONFIG[n.type];
        if (!cfg) return;
        showNotification(n);
        // Increment tab badge if not currently viewing the destination tab
        if (cfg.tab && activeMode !== cfg.tab) {
          unreadByTab[cfg.tab] = (unreadByTab[cfg.tab] || 0) + 1;
          renderTabs();
        }
        // Increment session badge if not currently viewing the destination session
        if (cfg.session && currentSessionId !== cfg.session) {
          unreadBySession[cfg.session] = (unreadBySession[cfg.session] || 0) + 1;
          renderSidebar();
        }
      });
    } catch {}
  }

  setInterval(pollNotifications, 30000);

  // ── Token counter ──
  const tokenEl = document.getElementById('token-counter');
  async function refreshTokens() {
    try {
      const res = await fetch(`${BASE}/tokens`);
      if (!res.ok) return;
      const data = await res.json();
      const t = data.total_tokens || 0;
      const label = t >= 1000 ? `${(t / 1000).toFixed(1)}k` : `${t}`;
      tokenEl.textContent = `Tokens today: ${label}`;
    } catch {}
  }
  refreshTokens();
  setInterval(refreshTokens, 60000);

  // ── Mobile sidebar toggle ──
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  const _origSwitch = switchSession;
  switchSession = async function(id) {
    await _origSwitch(id);
    if (window.innerWidth <= 600) {
      document.getElementById('sidebar').classList.remove('open');
    }
  };

  // ── Init ──
  (async function init() {
    ensureDefaults();
    await syncSessionsFromServer();
    renderTabs();
    await switchMode(activeMode);
    pollNotifications();
  })();
</script>
</body>
</html>
